<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Zero To One · 从零开始学 AI Agent</title>
<meta name="description" content="0 基础入门 AI Agent 开发：17 章渐进教程、每章可运行代码、内嵌 AI 教练、8 级项目阶梯、面试题库。离线可学，无需 API Key。">
<meta name="color-scheme" content="light dark">

<!-- 内联启动画面：content.js 有 1.4MB，在网络盘或老机器上解析要几百毫秒，
     先给用户一个反馈，避免白屏。app.js 加载完成后会把它移除。 -->
<style>
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        flex-direction:column;gap:14px;background:#f6f7fb;color:#4a5169;
        font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;z-index:99}
  #boot b{font-size:19px;font-weight:600;color:#1c2030;letter-spacing:.01em}
  #boot .bar{width:180px;height:3px;border-radius:2px;background:#e2e6f0;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:40%;border-radius:2px;background:#5b6ee1;
        animation:bootslide 1.1s ease-in-out infinite}
  @keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
  @media (prefers-color-scheme:dark){
    #boot{background:#0f1115;color:#b4bbc9}#boot b{color:#e6e9f0}#boot .bar{background:#242a35}
  }
</style>

<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="boot">
  <b>Agent Zero To One</b>
  <div class="bar"><i></i></div>
  <span>正在加载 17 章教程…</span>
</div>

<div id="app">

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="展开导航">☰</button>

    <a class="brand" href="#/">
      <span class="brand-mark">A2O</span>
      <span class="brand-text">
        <strong>Agent Zero To One</strong>
        <small>从零开始学 AI Agent</small>
      </span>
    </a>

    <div class="search" id="search">
      <input class="search-input" id="searchInput" type="search" autocomplete="off"
             placeholder="搜索章节 / 专题 / 面试题…" aria-label="搜索">
      <button class="search-clear" id="searchClear" aria-label="清空">×</button>
      <div class="search-results" id="searchResults"></div>
    </div>

    <a class="progress-pill" id="progressPill" href="#/progress" title="查看总进度">
      <span class="progress-pill-num">0%</span>
    </a>

    <button class="icon-btn" id="themeBtn" aria-label="切换深色模式" title="切换深色模式">◐</button>
  </header>

  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main" id="main"></main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script src="assets/markdown.js"></script>
<script src="assets/app.js"></script>

</body>
</html>
